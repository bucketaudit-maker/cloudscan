services:
  db:
    image: postgres:16-alpine
    container_name: cloudscan-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cloudscan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-cloudscan}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cloudscan} -d ${POSTGRES_DB:-cloudscan}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: cloudscan-api
    ports:
      - "8000:8000"
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '2.0'
    environment:
      - APP_ENV=production
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production-please}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-cloudscan}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-cloudscan}
      - SCANNER_CONCURRENCY=50
      - CORS_ORIGINS=http://localhost,http://localhost:80,http://localhost:5173
      - AI_PROVIDER=${AI_PROVIDER:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-}
      - RUN_DB_MIGRATIONS_ON_STARTUP=false
      - ENABLE_MONITOR_SCHEDULER=false
      - ENABLE_SCAN_SCHEDULER=false
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 3

  monitor:
    build: ./backend
    container_name: cloudscan-monitor
    command: ["python", "-m", "backend.app.workers.monitor_scheduler"]
    environment:
      - APP_ENV=production
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production-please}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-cloudscan}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-cloudscan}
      - AI_PROVIDER=${AI_PROVIDER:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-}
      - RUN_DB_MIGRATIONS_ON_STARTUP=false
      - ENABLE_MONITOR_SCHEDULER=true
      - MONITOR_SCHEDULER_INTERVAL_SECONDS=300
      - ENABLE_SCAN_SCHEDULER=true
      - SCAN_SCHEDULER_INTERVAL_SECONDS=60
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: cloudscan-ui
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
