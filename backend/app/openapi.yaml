      summary: Create alert rule
      operationId: createAlertRule
      security: [BearerAuth: [], ApiKeyAuth: []]
      description: |
        Create a custom alert rule with conditions. Conditions are AND-combined.
        Supported condition types: `file_extension`, `file_size_gt`, `file_name_contains`,
        `bucket_name_contains`, `bucket_status`, `provider`, `file_count_gt`, `classification`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, conditions]
              properties:
                name: { type: string }
                description: { type: string }
                severity: { type: string, enum: [critical, high, medium, low, info], default: medium }
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type: { type: string, example: file_extension }
                      value: { type: string, example: env }
                actions: { type: array, items: { type: string }, default: ["alert"] }
      responses:
        '201':
          description: Rule created
    get:
      tags: [Alert Rules]
      summary: List alert rules
      operationId: listAlertRules
