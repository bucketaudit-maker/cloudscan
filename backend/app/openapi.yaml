openapi: 3.0.3
info:
  title: BucketAudit API
  description: |
    Security research platform for discovering and analyzing publicly accessible cloud storage buckets
    across AWS S3, Azure Blob, GCP Storage, DigitalOcean Spaces, and Alibaba OSS.

    ## Authentication
    All authenticated endpoints accept one of:
    - **Bearer Token**: `Authorization: Bearer <jwt_token>` — obtained via `/auth/login`
    - **API Key Header**: `X-API-Key: <api_key>` — found in user profile
    - **API Key Query**: `?access_token=<api_key>`

    Endpoints marked `auth_required` allow anonymous access with reduced rate limits.
    Endpoints marked `auth_required_strict` return 401 if no credentials are provided.

    ## Rate Limits
    | Tier | Daily Limit |
    |------|------------|
    | Free | 100 |
    | Premium | 5,000 |
    | Enterprise | 50,000 |

    Rate-limited responses return `429` with `limit`, `tier`, and `reset_at` fields.

    ## Pagination
    List endpoints support `page` and `per_page` (max 200) query parameters.
    Responses include `items`, `total`, `page`, and `per_page` fields.
  version: 1.0.0
  contact:
    name: BucketAudit
  license:
    name: MIT

servers:
  - url: /api/v1
    description: API v1

tags:
  - name: Health
    description: System health and status
  - name: Auth
    description: Authentication, registration, password reset, 2FA
  - name: Files
    description: File search, export, and preview
  - name: Buckets
    description: Cloud storage bucket listing and details
  - name: Scans
    description: Discovery scans and scheduling
  - name: Statistics
    description: Analytics, dashboard, and trends
  - name: Monitoring
    description: Watchlists, alerts, and webhooks
  - name: AI
    description: AI-powered classification, risk scoring, and search
  - name: Organizations
    description: Multi-tenant organization management
  - name: Notifications
    description: In-app notifications and preferences
  - name: Compliance
    description: Compliance frameworks and checks
  - name: Remediations
    description: Remediation tracking and SLA
  - name: Reports
    description: Report generation and scheduling
  - name: Integrations
    description: Third-party integrations (Slack, Jira)
  - name: Tags
    description: Bucket tagging and bookmarks
  - name: Drift
    description: Scan diff and drift detection
  - name: Alert Rules
    description: Custom alert rule engine
  - name: Activity
    description: Audit log and activity tracking

paths:
  # ═══════════════════════════════════════════
  # HEALTH
  # ═══════════════════════════════════════════
  /health:
    get:
      tags: [Health]
      summary: Health check
      operationId: healthCheck
      responses:
        '200':
          description: API is running
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  version: { type: string, example: "1.0.0" }

  /csrf-token:
    get:
      tags: [Health]
      summary: Get CSRF token
      operationId: getCsrfToken
      security: [BearerAuth: []]
      responses:
        '200':
          description: CSRF token for form submissions
          content:
            application/json:
              schema:
                type: object
                properties:
                  csrf_token: { type: string }
                  expires_at: { type: string, format: date-time }

  # ═══════════════════════════════════════════
  # AUTH
  # ═══════════════════════════════════════════
  /auth/register:
    post:
      tags: [Auth]
      summary: Register new account
      operationId: register
      description: Creates a new user account and returns a JWT token. Rate limited.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, username, password]
              properties:
                email: { type: string, format: email, example: user@example.com }
                username: { type: string, minLength: 2, example: johndoe }
                password: { type: string, minLength: 6, example: securePass123 }
      responses:
        '200':
          description: Registration successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  user:
                    $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'

  /auth/login:
    post:
      tags: [Auth]
      summary: Login
      operationId: login
      description: |
        Authenticate with email and password. If 2FA is enabled, returns `requires_2fa: true`
        with a `temp_token` — use `/auth/2fa/verify` to complete login.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200':
          description: Login successful (or 2FA required)
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      token: { type: string }
                      user: { $ref: '#/components/schemas/User' }
                  - type: object
                    properties:
                      requires_2fa: { type: boolean, example: true }
                      temp_token: { type: string }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/me:
    get:
      tags: [Auth]
      summary: Get current user profile
      operationId: getMe
      security: [BearerAuth: [], ApiKeyAuth: []]
      responses:
        '200':
          description: User profile with API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Request password reset
      operationId: forgotPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '200':
          description: Reset token generated (in dev mode, returned directly)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  token: { type: string, description: Only returned in development mode }

  /auth/reset-password:
    post:
      tags: [Auth]
      summary: Reset password with token
      operationId: resetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string }
                password: { type: string, minLength: 6 }
      responses:
        '200':
          description: Password reset successful, returns new JWT
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  user: { $ref: '#/components/schemas/User' }

  /auth/rotate-key:
    post:
      tags: [Auth]
      summary: Rotate API key
      operationId: rotateApiKey
      security: [BearerAuth: [], ApiKeyAuth: []]
      responses:
        '200':
          description: New API key generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  api_key: { type: string, example: ba_a1b2c3d4e5f6... }

  /auth/settings:
    put:
      tags: [Auth]
      summary: Update user settings
      operationId: updateSettings
      security: [BearerAuth: [], ApiKeyAuth: []]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                username: { type: string }
                password: { type: string, minLength: 6 }
      responses:
        '200':
          description: Settings updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }

  /auth/2fa/setup:
    post:
      tags: [Auth]
      summary: Initialize 2FA setup
      operationId: setup2fa
      security: [BearerAuth: [], ApiKeyAuth: []]
      description: Returns a TOTP secret for the user to add to their authenticator app.
      responses:
        '200':
          description: TOTP secret and provisioning URI
          content:
            application/json:
              schema:
                type: object
                properties:
                  secret: { type: string, example: JBSWY3DPEHPK3PXP }
                  uri: { type: string, example: "otpauth://totp/BucketAudit:user@example.com?secret=..." }

  /auth/2fa/confirm:
    post:
      tags: [Auth]
      summary: Confirm 2FA setup with code
      operationId: confirm2fa
      security: [BearerAuth: [], ApiKeyAuth: []]
      description: Verifies the TOTP code and enables 2FA. Returns backup codes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, example: "123456" }
      responses:
        '200':
          description: 2FA enabled with backup codes
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  backup_codes: { type: array, items: { type: string }, example: ["abc12345", "def67890"] }

  /auth/2fa/verify:
    post:
      tags: [Auth]
      summary: Verify 2FA code during login
      operationId: verify2fa
      description: Completes login when 2FA is enabled. Requires the temp_token from the login response.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [temp_token, code]
              properties:
                temp_token: { type: string }
                code: { type: string, example: "123456" }
      responses:
        '200':
          description: Login complete
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  user: { $ref: '#/components/schemas/User' }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/2fa/disable:
    post:
      tags: [Auth]
      summary: Disable 2FA
      operationId: disable2fa
      security: [BearerAuth: [], ApiKeyAuth: []]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string }
      responses:
        '200':
          description: 2FA disabled
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }

  /auth/2fa/status:
    get:
      tags: [Auth]
      summary: Get 2FA status
      operationId: get2faStatus
      security: [BearerAuth: [], ApiKeyAuth: []]
      responses:
        '200':
          description: 2FA status
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled: { type: boolean }
                  backup_codes_remaining: { type: integer }

  # ═══════════════════════════════════════════
  # FILES
  # ═══════════════════════════════════════════
  /files:
    get:
      tags: [Files]
      summary: Search files
      operationId: searchFiles
      security: [BearerAuth: [], ApiKeyAuth: []]
      description: |
        Full-text search across indexed files. Supports exact match, wildcard patterns,
        regex, and advanced filters. Rate limited per tier.
      parameters:
        - name: q
          in: query
          description: Search query (filename, path). Supports wildcards.
          schema: { type: string, example: "*.env" }
        - name: regex
          in: query
          description: Regex pattern to match against file paths
          schema: { type: string, example: ".*\\.sql$" }
        - name: ext
          in: query
          description: File extension filter
          schema: { type: string, example: csv }
        - name: exclude_ext
          in: query
          description: Exclude file extension
          schema: { type: string, example: jpg }
        - name: provider
          in: query
          description: Cloud provider filter
          schema: { type: string, enum: [aws, azure, gcp, digitalocean, alibaba] }
        - name: bucket
          in: query
          description: Filter by bucket name
          schema: { type: string }
        - name: sort
          in: query
          description: Sort order
          schema: { type: string, enum: [relevance, newest, oldest, largest, smallest], default: relevance }
        - name: min_size
          in: query
          description: Minimum file size in bytes
          schema: { type: integer }
        - name: max_size
          in: query
          description: Maximum file size in bytes
          schema: { type: integer }
        - name: date_from
          in: query
          description: Files modified after this date
          schema: { type: string, format: date }
        - name: date_to
          in: query
          description: Files modified before this date
          schema: { type: string, format: date }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: per_page
          in: query
          schema: { type: integer, default: 50, maximum: 200 }
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/File' }
                  total: { type: integer }
                  page: { type: integer }
                  per_page: { type: integer }
        '429':
          $ref: '#/components/responses/RateLimited'

  /files/export:
    get:
      tags: [Files]
      summary: Export search results
      operationId: exportFiles
      security: [BearerAuth: [], ApiKeyAuth: []]
      description: Export search results as CSV or JSON. Same query parameters as `/files`.
      parameters:
        - name: format
          in: query
          required: true
          schema: { type: string, enum: [csv, json], default: csv }
        - name: q
          in: query
          schema: { type: string }
        - name: ext
          in: query
          schema: { type: string }
        - name: provider
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Exported file
          content:
            text/csv:
              schema: { type: string }
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/File' }

  /files/random:
    get:
      tags: [Files]
      summary: Get random file sample
      operationId: randomFiles
      security: [BearerAuth: [], ApiKeyAuth: []]
      parameters:
        - name: count
          in: query
          schema: { type: integer, default: 10, maximum: 100 }
      responses:
        '200':
          description: Random files
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/File' }

  /files/{file_id}/preview:
    get:
      tags: [Files]
      summary: Preview file content
      operationId: previewFile
      security: [BearerAuth: [], ApiKeyAuth: []]
      description: Returns the first 4KB of text-based files. Only works for text content types.
      parameters:
        - name: file_id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: File preview
          content:
            application/json:
              schema:
                type: object
                properties:
                  content: { type: string }
                  content_type: { type: string }
                  truncated: { type: boolean }
        '404':
          $ref: '#/components/responses/NotFound'

  # ═══════════════════════════════════════════
  # SAVED SEARCHES
  # ═══════════════════════════════════════════
  /searches/saved:
    post:
      tags: [Files]
      summary: Save a search
      operationId: saveSearch
      security: [BearerAuth: [], ApiKeyAuth: []]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, query_params]
              properties:
                name: { type: string, example: "My backup search" }
                query_params: { type: object, description: "Search parameters to save" }
      responses:
        '201':
          description: Search saved
    get:
      tags: [Files]
      summary: List saved searches
      operationId: listSavedSearches
      security: [BearerAuth: [], ApiKeyAuth: []]
      responses:
        '200':
          description: Saved searches
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { type: object } }

  /searches/saved/{search_id}:
    delete:
      tags: [Files]
      summary: Delete saved search
      operationId: deleteSavedSearch
      security: [BearerAuth: [], ApiKeyAuth: []]
      parameters:
        - name: search_id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Deleted

  # ═══════════════════════════════════════════
  # BUCKETS
  # ═══════════════════════════════════════════
  /buckets:
    get:
      tags: [Buckets]
      summary: List buckets
      operationId: listBuckets
      security: [BearerAuth: [], ApiKeyAuth: []]
      parameters:
        - name: provider
          in: query
          schema: { type: string, enum: [aws, azure, gcp, digitalocean, alibaba] }
        - name: status
          in: query
          schema: { type: string, enum: [open, closed, partial] }
        - name: search
          in: query
          description: Search bucket names
          schema: { type: string }
        - name: tag_id
          in: query
          schema: { type: integer }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: per_page
          in: query
          schema: { type: integer, default: 50, maximum: 200 }
      responses:
        '200':
          description: Bucket list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Bucket' }
                  total: { type: integer }
                  page: { type: integer }
                  per_page: { type: integer }

  /buckets/{bucket_id}:
    get:
      tags: [Buckets]
      summary: Get bucket details
      operationId: getBucket
      security: [BearerAuth: [], ApiKeyAuth: []]
      parameters:
        - name: bucket_id
          in: path
          required: true
          schema: { type: integer }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: per_page
          in: query
          schema: { type: integer, default: 100 }
      responses:
        '200':
          description: Bucket with files
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Bucket'
                  - type: object
                    properties:
                      files:
                        type: array
                        items: { $ref: '#/components/schemas/File' }
                      files_total: { type: integer }
        '404':
          $ref: '#/components/responses/NotFound'

  # ═══════════════════════════════════════════
  # STATISTICS & DASHBOARD
  # ═══════════════════════════════════════════
  /stats:
    get:
      tags: [Statistics]
      summary: Public statistics
      operationId: getStats
      responses:
        '200':
          description: Platform statistics
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_buckets: { type: integer }
                  total_files: { type: integer }
                  total_size_bytes: { type: integer }
                  providers: { type: array, items: { type: object } }
                  top_extensions: { type: array, items: { type: object } }

  /stats/timeline:
    get:
      tags: [Statistics]
      summary: Discovery timeline
      operationId: getTimeline
      security: [BearerAuth: [], ApiKeyAuth: []]
      parameters:
        - name: days
          in: query
          schema: { type: integer, default: 30, maximum: 365 }
      responses:
        '200':
          description: Timeline data
          content:
            application/json:
              schema:
                type: object
                properties:
                  files_timeline: { type: array, items: { type: object } }
                  buckets_timeline: { type: array, items: { type: object } }
                  days: { type: integer }

  /stats/breakdown:
    get:
      tags: [Statistics]
      summary: File type & status breakdown
      operationId: getBreakdown
      security: [BearerAuth: [], ApiKeyAuth: []]
      responses:
        '200':
          description: Breakdown data
          content:
            application/json:
              schema:
                type: object
                properties:
                  risk_distribution: { type: array, items: { type: object } }
                  status_distribution: { type: array, items: { type: object } }
                  classification_distribution: { type: array, items: { type: object } }

  /dashboard/executive:
    get:
      tags: [Statistics]
      summary: Executive dashboard
      operationId: getExecutiveDashboard
      security: [BearerAuth: [], ApiKeyAuth: []]
      responses:
        '200':
          description: Executive summary with KPIs
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_buckets: { type: integer }
                  open_buckets: { type: integer }
                  exposure_rate: { type: number }
                  total_files: { type: integer }
                  risk_distribution: { type: object }
                  sensitive_files: { type: object }
                  recent_scans: { type: object }
                  unresolved_alerts: { type: object }
                  top_exposed_buckets: { type: array, items: { $ref: '#/components/schemas/Bucket' } }
                  drift_summary: { type: object }

  /dashboard/risk-trends:
    get:
      tags: [Statistics]
      summary: Risk trends over time
      operationId: getRiskTrends
      security: [BearerAuth: [], ApiKeyAuth: []]
      parameters:
        - name: days
          in: query
          schema: { type: integer, default: 30, maximum: 365 }
      responses:
        '200':
          description: Risk trend data
          content:
            application/json:
              schema:
                type: object
                properties:
                  risk_trends: { type: array, items: { type: object } }
                  days: { type: integer }

  /dashboard/remediation-sla:
    get:
      tags: [Statistics]
      summary: Remediation SLA metrics
      operationId: getRemediationSla
      security: [BearerAuth: [], ApiKeyAuth: []]
      responses:
        '200':
          description: SLA metrics
          content:
            application/json:
              schema:
                type: object
                properties:
                  time_to_close: { type: object }
                  overdue_by_priority: { type: object }
                  open_aging: { type: object, properties: { this_week: { type: integer }, this_month: { type: integer }, older: { type: integer } } }

  # ═══════════════════════════════════════════
  # SCANS
  # ═══════════════════════════════════════════
  /scans:
    post:
      tags: [Scans]
      summary: Start discovery scan
      operationId: startScan
      security: [BearerAuth: [], ApiKeyAuth: []]
      description: |
        Starts an asynchronous scan to discover cloud storage buckets. Returns 202.
        Monitor progress via SSE at `/events/scans` or by polling `GET /scans/{job_id}`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                keywords: { type: array, items: { type: string }, example: ["backup", "staging"] }
                companies: { type: array, items: { type: string }, example: ["acme"] }
                providers: { type: array, items: { type: string, enum: [aws, azure, gcp, digitalocean, alibaba] } }
                max_names: { type: integer, default: 1000, maximum: 50000 }
                regions_per_provider: { type: integer, default: 3 }
      responses:
        '202':
          description: Scan started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanJob'
    get:
      tags: [Scans]
      summary: List recent scans
      operationId: listScans
      security: [BearerAuth: [], ApiKeyAuth: []]
      description: Returns the 50 most recent scan jobs.
      responses:
        '200':
          description: Recent scans
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ScanJob' }

  /scans/{job_id}:
    get:
      tags: [Scans]
      summary: Get scan status
      operationId: getScan
      security: [BearerAuth: [], ApiKeyAuth: []]
      parameters:
        - name: job_id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Scan job details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanJob'
        '404':
          $ref: '#/components/responses/NotFound'

  /scans/{job_id}/cancel:
    post:
      tags: [Scans]
      summary: Cancel running scan
      operationId: cancelScan
      security: [BearerAuth: [], ApiKeyAuth: []]
      parameters:
        - name: job_id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Scan cancelled
        '404':
          $ref: '#/components/responses/NotFound'

  /scans/schedules:
    post:
      tags: [Scans]
      summary: Create scan schedule
      operationId: createSchedule
      security: [BearerAuth: [], ApiKeyAuth: []]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, keywords]
              properties:
                name: { type: string }
