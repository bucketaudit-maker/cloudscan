          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        name: { type: string }
                        display_name: { type: string }

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: JWT token from /auth/login
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key from user profile

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string }
    Unauthorized:
      description: Authentication required or invalid
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string, example: Authentication required }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string, example: Not found }
    RateLimited:
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string, example: Rate limit exceeded }
              limit: { type: integer, example: 100 }
              tier: { type: string, example: free }
              reset_at: { type: string, format: date-time }

  schemas:
    User:
      type: object
      properties:
        id: { type: integer }
        email: { type: string }
        username: { type: string }
        tier: { type: string, enum: [free, premium, enterprise] }
        api_key: { type: string }
        totp_enabled: { type: boolean }
        queries_today: { type: integer }
        joined_at: { type: string, format: date-time }

    Bucket:
      type: object
      properties:
        id: { type: integer }
        name: { type: string, example: company-backups }
        provider_name: { type: string, example: aws }
        region: { type: string, example: us-east-1 }
        url: { type: string, format: uri }
        status: { type: string, enum: [open, closed, partial] }
        file_count: { type: integer }
        total_size_bytes: { type: integer }
        risk_score: { type: integer, minimum: 0, maximum: 100 }
        risk_level: { type: string, enum: [critical, high, medium, low, info] }
        first_seen: { type: string, format: date-time }
        last_scanned: { type: string, format: date-time }

    File:
      type: object
      properties:
        id: { type: integer }
        bucket_id: { type: integer }
        name: { type: string, example: config/database.env }
        extension: { type: string, example: env }
        size: { type: integer }
        content_type: { type: string }
        last_modified: { type: string, format: date-time }
        ai_classification: { type: string, enum: [credentials, pii, financial, medical, infrastructure, source_code, database, generic] }
        ai_risk_score: { type: integer }

    ScanJob:
      type: object
      properties:
        id: { type: integer }
        scan_type: { type: string, example: discovery }
        status: { type: string, enum: [pending, running, completed, failed, cancelled] }
        config: { type: object }
        names_checked: { type: integer }
        buckets_found: { type: integer }
        buckets_open: { type: integer }
        files_indexed: { type: integer }
        created_at: { type: string, format: date-time }
        started_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time }
        created_by: { type: integer }

    Alert:
      type: object
      properties:
        id: { type: integer }
        bucket_id: { type: integer }
        type: { type: string }
        severity: { type: string, enum: [critical, high, medium, low, info] }
        title: { type: string }
        description: { type: string }
        is_read: { type: boolean }
        is_resolved: { type: boolean }
        created_at: { type: string, format: date-time }

    ScanDiff:
      type: object
      properties:
        id: { type: integer }
        bucket_id: { type: integer }
        diff_type: { type: string, enum: [new_bucket, status_change, files_added, files_removed, size_change] }
        summary: { type: string }
        details: { type: object }
        severity: { type: string, enum: [critical, high, medium, low, info] }
        is_reviewed: { type: boolean }
        created_at: { type: string, format: date-time }
